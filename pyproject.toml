[project]
name = "django-uv-web-app"
version = "0.1.0"
description = "Django task tracker fixture managed exclusively by uv — used to test Felix's Python/uv flows (scan, remediate, deps:update, smart major upgrades)."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "django==3.2.18",
    "djangorestframework==3.12.4",
    "requests==2.25.1",
    "gunicorn==19.10.0",
    "python-dotenv==0.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tasks", "tasktracker"]

[tool.uv]
# Keep this fixture deterministic: we want `uv sync` to install exactly the
# versions below so Felix always sees the same vulnerable baseline.
package = true
